<div style="text-align: center; font-family: sans-serif; padding: 40px; background: #0B1220; color: white; border-radius: 10px; max-width: 500px; margin: 0 auto;">
    <h1 style="color: #22D3EE; margin-bottom: 10px;">🌀 VortexVPN</h1>
    <p style="color: #aaa; margin-bottom: 30px;">Быстрый интернет без рекламы и лагов. 500 ГБ за 150 ₽/мес.</p>
    
    <button id="getTrialBtn" style="background: #8B5CF6; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;">
        Получить 5 ГБ бесплатно
    </button>
    
    <div id="result" style="margin-top: 20px; font-size: 14px; display: none;"></div>
</div>

<script>
document.getElementById('getTrialBtn').addEventListener('click', async function() {
    const btn = this;
    const resultDiv = document.getElementById('result');
    
    btn.innerText = "Генирирую ключ...";
    btn.disabled = true;
    resultDiv.style.display = 'none';

    try {
        // ВАЖНО: Замени 193.188.22.172:8080 на свой реальный IP и порт API
        const response = await fetch('https://sub.freedominternet.cc.cd/api/get_trial', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        
        const data = await response.json();
        
        if (data.success) {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <p style="color: #10B981;">✅ Тест выдан!</p>
                <p>Скачайте приложение <b>Happ</b> и добавьте эту ссылку:</p>
                <textarea style="width: 100%; height: 60px; margin-top: 10px; background: #1E293B; color: #22D3EE; border: 1px solid #333; padding: 10px; border-radius: 5px;" readonly>${data.link}</textarea>
                <p style="margin-top: 20px;"><a href="https://t.me/FreedomInternetVpnbot" style="color: #8B5CF6; font-weight: bold;">Перейти в Telegram-бот для покупки</a></p>
            `;
        } else {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<p style="color: #EF4444;">❌ ${data.error}</p>`;
        }
    } catch (error) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<p style="color: #EF4444;">❌ Ошибка соединения. Попробуйте позже.</p>`;
        console.error(error);
    } finally {
        btn.innerText = "Получить 5 ГБ бесплатно";
        btn.disabled = false;
    }
});
</script>
