<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VortexVPN - Быстрый интернет</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #0B1220; 
            color: white; 
            display: flex;      
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #151E2E; 
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h1 { color: #22D3EE; margin-bottom: 10px; }
        .btn { 
            background: #8B5CF6; color: white; border: none; 
            padding: 15px 30px; font-size: 18px; border-radius: 8px; 
            cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s;
        }
        .btn:hover { background: #22D3EE; }
    </style>
</head>
<body>

<div class="card">
    <h1>🌀 VortexVPN</h1>
    <p style="color: #aaa; margin-bottom: 30px;">Быстрый интернет без рекламы и лагов. 500 ГБ за 150 ₽/мес.</p>
    
    <button id="getTrialBtn" class="btn">
        Получить 5 ГБ бесплатно
    </button>
    
    <div id="result" style="margin-top: 20px; font-size: 14px; display: none;"></div>
</div>

<script>
document.getElementById('getTrialBtn').addEventListener('click', async function() {
    const btn = this;
    const resultDiv = document.getElementById('result');
    
    btn.innerText = "Генерирую ключ...";
    btn.disabled = true;
    resultDiv.style.display = 'none';

    try {
        const response = await fetch('https://sub.freedominternet.cc.cd:9443/api/get_trial', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        
        const data = await response.json();
        
        if (data.success) {
            resultDiv.style.display = 'block';
            const warning = data.already_received 
                ? `<p style="color: #F59E0B; font-size: 13px; margin-bottom: 10px;">⚠️ Вы уже получали тест за последние 24 часа. Вот та же самая ссылка:</p>`
                : `<p style="color: #10B981; font-weight: bold;">✅ Тест выдан!</p>`;
            
            resultDiv.innerHTML = `
                ${warning}
                <p>Скачайте приложение <b>Happ</b> и добавьте эту ссылку:</p>
                
                <div style="margin-top: 10px; text-align: left;">
                    <p style="font-size: 12px; color: #aaa; margin-bottom: 5px;">Нажми на ссылку, чтобы скопировать:</p>
                    <textarea 
                        onclick="this.select(); document.execCommand('copy'); this.style.borderColor='#10B981'; this.style.color='#10B981';"
                        style="width: 100%; height: 50px; background: #1E293B; color: #22D3EE; border: 1px solid #333; padding: 10px; border-radius: 5px; box-sizing: border-box; font-family: monospace; resize: none; cursor: pointer; transition: 0.3s;"
                        readonly>${data.link}</textarea>
                </div>

                <p style="margin-top: 20px;"><a href="https://t.me/FreedomInternetVpnbot" style="color: #8B5CF6; font-weight: bold; text-decoration: none;">Перейти в Telegram-бот для покупки</a></p>
            `;
        } else if (data.expired) {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <p style="color: #F59E0B; font-weight: bold; margin-bottom: 15px;">⏳ ${data.error}</p>
                <a href="https://t.me/FreedomInternetVpnbot" style="background: #8B5CF6; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">Купить полную подписку</a>
            `;
        } else {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<p style="color: #EF4444;">❌ ${data.error}</p>`;
        }
    } catch (error) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<p style="color: #EF4444;">❌ Ошибка соединения. Попробуйте позже.</p>`;
        console.error(error);
    } finally {
        btn.innerText = "Получить 5 ГБ бесплатно";
        btn.disabled = false;
    }
});
</script>

</body>
</html>
